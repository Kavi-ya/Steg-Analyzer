name: CI / CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 – Test on every push / PR
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test · Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y steghide exiftool

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check steg_analyzer/

      - name: Format check with black
        run: black --check steg_analyzer/ tests/

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=steg_analyzer \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 – Build wheel + sdist (runs only after tests pass)
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build + twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distributions with twine
        run: twine check dist/*

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 – Publish to PyPI (only on GitHub Release)
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'

    # Required for PyPI Trusted Publishing (OIDC – no API token needed)
    environment:
      name: pypi
      url: https://pypi.org/p/steg-analyzer
    permissions:
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No username/password needed when using Trusted Publishing.
        # Set up at: https://pypi.org/manage/account/publishing/
