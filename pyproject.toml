[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steg-analyzer"
version = "1.0.1"
description = "All-in-One Steganography Analysis & Extraction Tool"
authors = [{ name = "Steg Analyzer Contributors" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["steganography", "ctf", "forensics", "security", "lsb", "stego"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
full = [
    "jpegio>=0.0.3",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
steg-analyzer = "steg_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/steg-analyzer"
Repository = "https://github.com/your-org/steg-analyzer"
Issues = "https://github.com/your-org/steg-analyzer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["steg_analyzer*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
